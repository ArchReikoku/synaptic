# Minecraft — 26.x line (UNOBFUSCATED: no yarn mappings exist, so there is
# deliberately NO yarn_mappings key in this file).
minecraft_version=26.3

# --- Fabric ---------------------------------------------------------------
loader_version=0.20.1
# Stable Loom release for the non-remap `net.fabricmc.fabric-loom` plugin
# (never pin a SNAPSHOT: they are mutable and re-validated on a TTL, so a maven
# outage fails every build). 1.17.21 is the last release of the 1.17 line, which
# is the line Fabric's own 26.3 template still tracks. 1.18 needs Gradle 9.7+,
# which the 9.9.0 wrapper now satisfies, but it has not been tried (see CLAUDE.md).
loom_version=1.17.21
fabric_version=0.166.0+26.3

# --- NeoForge -------------------------------------------------------------
# NeoForge's version line tracks the game: 26.3.0.x is MC 26.3. The early 26.3
# builds were tagged -beta; this is a stable one.
neoforge_version=26.3.0.102
# ModDevGradle. Same rule as Loom above: pin a release, never a snapshot.
# 2.0.147 is the floor for 26.3: it brings NeoFormRuntime 2.0.31 / JST 2.0.11,
# which apply NeoForge's access transformers to anonymous classes correctly.
# Older ones leave HolderSet's anonymous contents() protected under a now-public
# parent, and the game fails to recompile before Synaptic is ever reached.
moddev_version=2.0.148
# NeoForm is the *vanilla* game jar recipe, used only by the `common` project so
# it can compile against Minecraft with no loader on the classpath at all. Take
# it from the NeoForge build's own moddev-config.json ("mcp" field) so the two
# projects are looking at the same game — 26.3.0.102 names neoform 26.3-1.
neoform_version=26.3-1
# Mixin, for the `common` project alone. Fabric Loader and NeoForge each bring
# their own at runtime; common has neither on its class path and still has to
# compile com.synaptic.mixin. This is the artifact NeoForge 26.3.0.102 lists among
# its own libraries, which is also the fork Loom uses — read it back out of
# moddev-config.json whenever neoforge_version moves, so all three projects stay
# on one Mixin.
mixin_version=0.17.4+mixin.0.8.7

# Mod Properties
mod_id=synaptic
mod_version=3.0.0
maven_group=com.synaptic
archives_base_name=synaptic

# Build JVM — decompile/build of 26.x is heap-hungry; the default heap OOMs, and
# there are now three projects wanting it rather than one.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
# Loom is not yet fully compatible with the configuration cache
# (FabricMC/fabric-loom#1349). ModDevGradle is, but this setting is global.
org.gradle.configuration-cache=false
