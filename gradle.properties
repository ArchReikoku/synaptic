# Minecraft and Fabric versions — 26.x line (UNOBFUSCATED: no yarn mappings exist,
# so there is deliberately NO yarn_mappings key in this file).
minecraft_version=26.2
loader_version=0.19.3
# Stable Loom release for the non-remap `net.fabricmc.fabric-loom` plugin
# (never pin a SNAPSHOT: they are mutable and re-validated on a TTL, so a maven
# outage fails every build). Compile-verified against MC 26.2.
loom_version=1.17.20

# Mod Properties — REPLACE THESE
mod_id=synaptic
mod_version=1.0.1
maven_group=com.synaptic
archives_base_name=synaptic

# Dependencies
fabric_version=0.154.2+26.2

# Build JVM — Loom decompile/build of 26.x is heap-hungry; the default heap OOMs
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
# Loom is not yet fully compatible with the configuration cache (FabricMC/fabric-loom#1349)
org.gradle.configuration-cache=false
