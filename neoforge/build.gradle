plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
	archivesName = "${rootProject.archives_base_name}-neoforge"
}

// Same arrangement as the Fabric project: common's sources are compiled here
// rather than consumed as a jar, so the shared classes, the mixin config and the
// assets all land in this jar directly. See fabric/build.gradle for why.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

neoForge {
	version = rootProject.neoforge_version

	// Without this the dev runtime has no idea which classes belong to the mod,
	// and the mixin config in the resources never gets applied.
	mods {
		synaptic {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}
}

// fabric.mod.json takes `${version}`; neoforge.mods.toml takes the same value
// through the same mechanism, so the two metadata files cannot drift from
// gradle.properties independently of each other.
processResources {
	// Not called `properties`: that is a name Project already owns, and shadowing
	// it inside a task closure is a debugging session nobody needs.
	def expansions = [
		version          : project.version,
		mod_id           : rootProject.mod_id,
		minecraft_version: rootProject.minecraft_version,
		neoforge_version : rootProject.neoforge_version
	]
	inputs.properties expansions
	filesMatching('META-INF/neoforge.mods.toml') {
		expand expansions
	}
}
