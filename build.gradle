// Root project. Builds nothing itself — every artifact comes out of `fabric`
// or `neoforge`. What lives here is the settings all three have to agree on,
// because the JDK story in CLAUDE.md only holds if it is stated once.
subprojects {
	apply plugin: 'java'

	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.neoforged.net/releases' }
		// Resilience: declare mavenCentral explicitly so an outage at either mod
		// maven can't take out resolution of their mavenCentral-hosted transitives.
		mavenCentral()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		// The chat messages contain a literal heart glyph; without this javac would
		// decode the source with whatever the build machine's default charset is.
		it.options.encoding = 'UTF-8'
	}

	java {
		toolchain {
			// 25, matching options.release above, the mixin JAVA_25
			// compatibilityLevel and fabric.mod.json's `"java": ">=25"`. Still
			// the four places CLAUDE.md names — NeoForge has no metadata field
			// for it, so neoforge.mods.toml adds no fifth — and changing one
			// without the rest is still how you get a jar that compiles here
			// and refuses to load there.
			languageVersion = JavaLanguageVersion.of(25)
		}
	}
}

// Collects both loader jars in one place, so "where is the build output" has a
// single answer again now that there are two of them.
tasks.register('collectJars', Copy) {
	dependsOn ':fabric:build', ':neoforge:build'
	from(project(':fabric').layout.buildDirectory.dir('libs'))
	from(project(':neoforge').layout.buildDirectory.dir('libs'))
	into layout.buildDirectory.dir('libs')
	include '*.jar'
	exclude '*-sources.jar'
}
